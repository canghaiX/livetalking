# Independent workspace deployment; the existing service uses port 8010.
model: wav2lip
avatar_id: wav2lip256_avatar1
batch_size: 16
face_blend_start_ratio: 0.44
face_blend_feather_ratio: 0.10
tts: qwentts
REF_FILE: Serena
qwen_tts_retry_initial_seconds: 1.0
qwen_tts_retry_max_seconds: 8.0
qwen_tts_response_timeout_seconds: 60.0
qwen_tts_first_buffer_frames: 3
qwen_tts_prefetch_segments: 1
qwen_tts_prefetch_queue_size: 4
transport: webrtc
stun: 'stun:stun.freeswitch.org:3478'
listenport: 8020
max_session: 10
webrtc_sync_buffer_frames: 2
llm_stream_segment_max_chars: 40
lip_sync_offset_ms: 0
lip_sync_calibration: transport_zero_reference
llm_provider: deepseek
llm_model: deepseek-flash
avatar_motion_config: deployment/avatar_motion.json
