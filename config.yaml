###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16
face_blend_start_ratio: 0.44
face_blend_feather_ratio: 0.10

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: qwentts                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
avatar_motion_config: deployment/avatar_motion.json
REF_FILE: Serena               # Fixed Qwen TTS voice; the runtime ignores per-request voice overrides
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash
qwen_tts_retry_initial_seconds: 1.0
qwen_tts_retry_max_seconds: 8.0
qwen_tts_response_timeout_seconds: 60.0
qwen_tts_first_buffer_frames: 3
qwen_tts_prefetch_segments: 1
qwen_tts_prefetch_queue_size: 4

# -------- LLM ----------------------------------------------------------
llm_provider: dashscope        # dashscope / orcarouter
llm_model: ''                  # model override, empty = provider default (qwen-plus / orcarouter/auto)
llm_stream_segment_max_chars: 40

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 10                # max concurrent sessions
webrtc_sync_buffer_frames: 2   # about 80ms initial audio/video buffer
lip_sync_offset_ms: 0          # transport-calibrated offset; override after Serena onset scan
lip_sync_calibration: transport_zero_reference
listenport: 8010
