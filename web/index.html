<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铁科院数字人讲解员</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root { color-scheme:light; --ink:#27302e; --muted:#67736e; --line:#dde3df; --accent:#176c59; --page:#f5f7f6; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--page); }
    button,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible,a:focus-visible { outline:3px solid #7cbca9; outline-offset:3px; }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 28px; border-bottom:1px solid var(--line); background:#fff; }
    h1 { margin:0; font-size:20px; font-weight:650; }
    .topbar a { color:var(--muted); text-decoration:none; font-size:13px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 400px; height:calc(100dvh - 64px); max-width:1440px; margin:0 auto; }
    .stage { min-width:0; min-height:0; display:flex; flex-direction:column; padding:18px 24px 24px; }
    .stage-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; margin-bottom:12px; }
    .status { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
    .dot { width:8px; height:8px; border-radius:50%; background:#b9c2bd; }
    .dot.on { background:#27866b; }
    .connect { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:8px 13px; min-height:38px; }
    .screen { min-height:0; flex:1; display:flex; align-items:center; justify-content:center; background:#e6eae7; position:relative; }
    .video-wrap { position:relative; min-height:0; height:100%; max-width:100%; aspect-ratio:786/1178; }
    video { display:block; width:100%; height:100%; object-fit:contain; }
    .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
    .subtitle { position:absolute; left:4%; right:4%; bottom:4%; padding:9px 12px; border-radius:4px; color:#fff; background:rgba(15,20,18,.76); font-size:18px; line-height:1.55; text-align:center; overflow-wrap:anywhere; max-height:36%; overflow:auto; }
    [hidden] { display:none !important; }
    .dialog { min-height:0; border-left:1px solid var(--line); display:flex; flex-direction:column; background:#fff; }
    .dialog-head { padding:26px 22px 18px; border-bottom:1px solid var(--line); font-weight:650; font-size:16px; }
    .messages { flex:1; min-height:100px; overflow:auto; overscroll-behavior:contain; padding:20px; }
    .empty { color:var(--muted); text-align:center; padding:36px 10px; font-size:14px; }
    .message { margin-bottom:22px; }
    .message-label { margin-bottom:5px; color:var(--muted); font-size:12px; }
    .message-text { line-height:1.75; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message.user .message-text { color:#176c59; }
    .message.pending .message-text { color:var(--muted); }
    .compose { border-top:1px solid var(--line); padding:16px 20px 22px; }
    textarea { display:block; width:100%; height:94px; max-height:180px; resize:vertical; border:1px solid #cbd5cf; border-radius:6px; padding:10px 12px; line-height:1.5; outline:none; font-size:14px; }
    textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px #176c5918; }
    .actions { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    .send,.voice { display:flex; justify-content:center; align-items:center; gap:7px; min-height:40px; border-radius:6px; padding:8px 16px; font-size:14px; }
    .send { border:1px solid var(--accent); background:var(--accent); color:#fff; }
    .voice { border:1px solid #cbd5cf; background:#fff; color:var(--ink); user-select:none; touch-action:none; }
    .voice.recording { color:#b43f49; border-color:#cc6f77; background:#fff4f5; }
    .voice-hint { min-height:20px; margin-bottom:8px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .error { margin:10px 20px; padding:9px 11px; color:#9d2435; background:#fff0f2; border:1px solid #f4c3ca; border-radius:6px; font-size:13px; overflow-wrap:anywhere; }
    @media(max-width:800px) {
      .topbar { height:auto; min-height:58px; padding:12px 16px; flex-wrap:wrap; }
      h1 { font-size:18px; }
      .layout { display:flex; flex-direction:column; height:auto; }
      .stage { padding:10px 12px 16px; }
      .screen { flex:none; height:55dvh; min-height:300px; }
      .dialog { height:58dvh; min-height:380px; border-left:0; border-top:1px solid var(--line); }
      .dialog-head { padding:16px 20px; }
      .subtitle { font-size:15px; }
      .messages { padding:14px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar"><h1>铁科院数字人讲解员</h1><a href="/avatar-package.html">角色包管理</a></header>
  <main class="layout">
    <section class="stage" aria-label="数字人">
      <div class="stage-head">
        <div class="status" role="status"><span class="dot" id="statusDot"></span><span id="statusText">未连接</span></div>
        <button class="connect" id="connectButton"><i class="bi bi-play-fill" aria-hidden="true"></i><span>开始连接</span></button>
      </div>
      <div class="screen"><span class="placeholder" id="videoPlaceholder">数字人未连接</span><div class="video-wrap"><video id="video" autoplay playsinline></video><div class="subtitle" id="subtitle" aria-live="polite" hidden></div></div></div>
      <div class="error" id="connectionError" role="alert" hidden></div>
    </section>
    <section class="dialog" aria-label="对话">
      <div class="dialog-head">对话</div>
      <div class="messages" id="messages" role="log" aria-live="polite"><div class="empty" id="empty">暂无对话</div></div>
      <div class="error" id="dialogError" role="alert" hidden></div>
      <form class="compose" id="chatForm">
        <div class="voice-hint" id="voiceHint" role="status"></div>
        <textarea id="messageInput" aria-label="输入问题" placeholder="输入问题…" maxlength="4000"></textarea>
        <div class="actions"><button type="button" class="voice" id="voiceButton" aria-pressed="false" title="按住说话，松开后发送"><i class="bi bi-mic" aria-hidden="true"></i><span>按住说话</span></button><button type="submit" class="send" id="sendButton"><i class="bi bi-send" aria-hidden="true"></i>发送</button></div>
      </form>
    </section>
  </main>
  <script src="/index.js" defer></script>
</body>
</html>
